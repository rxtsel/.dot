# BACKGROUND
background {
    monitor =
    path = ~/.dot/wallpapers/green_03.png
    blur_passes = 2
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = SF Pro Display Bold
    position = 0, -100
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 130
    font_family = SF Pro Display Bold
    position = 0, -140
    halign = center
    valign = top
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.dot/.config/hypr/scripts/songdetail.sh)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = SF Pro Display
    position = 0, -345
    halign = center
    valign = top
}

# Profie-Photo
image {
    monitor =
    path = ~/Pictures/profile.jpeg # Path to your profile photo PNG or JPG
    border_color = 0xffdddddd
    border_size = 0
    size = 60
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 145
    halign = center
    valign = bottom
}

# USER
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 16
    font_family = SF Pro Display
    position = 0, 110
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 150, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
}
